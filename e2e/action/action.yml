# probe-android built from this checkout, for the e2e workflow. Probe
# resolves an action before the first job starts, so the executable is
# built before probe runs:
#
#   go build -o e2e/action/probe-android . && probe e2e/workflow.yml
name: android
description: Drive an app on an Android emulator or device through adb
params: [app, device, actions, timeout]
runs:
  using: binary
  path: probe-android
