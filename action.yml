    darwin_amd64: "298119c9e6e1669c6b3934b7ed9f61272646cef0c1c9268b98fafbd26242ceee"
    darwin_arm64: "98a2c61b3a4f08bd00dbafbc99f3cfdd8bdcad49975494e0e946725cd960dc14"
    linux_amd64: "732e6f8f2a9698fe183f7653f298b60bb5538dcf542286564168585087e891c1"
    linux_arm64: "2c745d6261eeb831d09ee29eac00b7622297e252885e4fc019f00f1d1529c6fd"
