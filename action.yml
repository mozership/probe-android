    darwin_amd64: "237e856e12649f7e6be9ace2cb445478f3b9d222e40cf3dc9595b462b4330f88"
    darwin_arm64: "84cf26a5a6f6692456fa3afc613c9b9804231cf67857fddd890ee18d723704d9"
    linux_amd64: "0fe4ce10062b3e5ecc1ef05cb2cf8781771fac5a448d825841be53fe43db96f6"
    linux_arm64: "ab1f0476edee7d04cf4ec3c87df170f493804334a7f41ffee78d708af70c2d3b"
