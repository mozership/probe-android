name: Test
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  # internal/adb/dumper.jar, which the action pushes to the device to read
  # the screen, is committed, so that the action builds with Go alone. This
  # builds it again from dumper/ProbeAndroidDump.java and fails when the
  # two differ.
  dumper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: dumper/build.sh
      - run: git diff --exit-code internal/adb/dumper.jar

  # The tests above use a fake in place of adb. This one drives the Settings
  # app of an emulator through Probe, as a workflow would.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # Probe resolves the action before the first job of a workflow, so it
      # is built first.
      - run: go build -o e2e/action/probe-android .
      # probe-action checks probe against the digest of its release, and
      # adds it to PATH for the emulator's script and the workflows the e2e
      # workflow runs in turn.
      - name: Install Probe
        uses: mozership/probe-action@831b8b6c6aa0c8a61aa75b58f36a08da5c579e83 # v1.3.0
        with:
          install-only: true
          version: v1.30.0
      # ADBKeyBoard types the text input text cannot. Its digest is the one
      # GitHub lists for the asset.
      - name: Download ADBKeyBoard
        run: |
          curl -fsSL -o "$RUNNER_TEMP/adbkeyboard.apk" https://github.com/senzhk/ADBKeyBoard/releases/download/v2.5-dev/keyboardservice-debug.apk
          echo "41a8a0996d7397a2390d1ca16a75cb66c4a7bdaa89cf4e63600a4d3fb346fbbb  $RUNNER_TEMP/adbkeyboard.apk" | sha256sum -c -
      # The emulator runs at speed only with KVM, which the runner has but
      # does not open to the job's user.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the e2e workflow on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          # When the e2e fails, the screen it was left on is kept: what
          # uiautomator reads of it, and a screenshot.
          script: |
            adb install -r "$RUNNER_TEMP/adbkeyboard.apk"
            probe e2e/workflow.yml || { mkdir -p "$RUNNER_TEMP/screen"; adb exec-out uiautomator dump /dev/tty > "$RUNNER_TEMP/screen/screen.xml"; adb exec-out screencap -p > "$RUNNER_TEMP/screen/screen.png"; exit 1; }
      - name: Keep the screen of a failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screen
          path: ${{ runner.temp }}/screen
          if-no-files-found: ignore

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      # go fix rewrites code to what the Go version in go.mod has, such as
      # maps.Copy for a loop that copies a map. -diff prints the rewrites
      # instead of applying them, and fails when there is any: run go fix ./...
      # and commit what it changes.
      - name: go fix
        run: go fix -diff ./...

  # govulncheck fails on a vulnerability the code calls, in a module it
  # requires or in the standard library of the Go in go.mod, which releases
  # are built with: update the module, or the Go in go.mod.
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
